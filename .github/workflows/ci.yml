name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, macos-15-intel is Intel.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Build and run checks
        run: ./test.sh

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          ARCH=$(uname -m)
          zip -qry "dist/StayAwake-${ARCH}.zip" StayAwake.app
          echo "packaged dist/StayAwake-${ARCH}.zip"

      - name: Upload build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: stayawake-${{ matrix.os }}
          path: dist/*.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "StayAwake $GITHUB_REF_NAME" \
            --generate-notes
